<h1>感应加热&amp;开关电源</h1>
<h2>目的</h2>
<p>之前做电磁轨道炮（失败了）需要特殊形状弹丸，需要融化铝来加工，但铝难以融化，所以想用感应加热来做。</p>
<p>开关电源和感应加热技术上很相似</p>
<h2>电路框架</h2>
<p>LC并联谐振</p>
<p>开关管在每个周期管子两端电压过0时导通为LC补充能量。</p>
