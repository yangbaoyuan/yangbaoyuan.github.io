<h1>压缩机热泵</h1>
<h2>组成</h2>
<p>压缩机（气泵，用小体积的）</p>
<p>节流阀（毛细管）</p>
<p>冷凝器（铜管）</p>
<p>蒸发器（铜管）</p>
<h2>铜管焊接</h2>
<p>铜磷焊条（BCuP）    强度高    熔点约 650～850℃
焊接时通常使用：
氧乙炔火焰
氧丙烷火焰
MAPP 气火焰</p>
<p>焊锡 强度低</p>
<p>需去掉焊锡再用铜磷焊条焊接  加热刮、磨等</p>
<p>感应加热！！！
氢氧焰！！！</p>
<h2>抽气</h2>
<p>气泵：针筒加两个单向阀</p>
<p>操作：抽一次，加冷媒，再抽一次，再加冷媒。（优点：单次抽气真空度要求低）</p>
<h2>制冷剂</h2>
<p>r600a：高压低但低压为负压，危险</p>
<p>r134a：低压非负压但高压高，也会燃烧</p>
